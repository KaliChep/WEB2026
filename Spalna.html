    <h2><b>Прозори</b></h2>
    <div>
        <label for="prozori">Вклучен сензор: </label>
        <input type="checkbox" id="prozori" name="prozori">
    </div>
    <div>
        <label for="pbaterija">Батерија: </label>
        <progress type="pbaterija" id="pbaterija" name="sbaterija" value="64" min="0" max="100"></progress>
        <span>64%</span>
    </div>
    <p>
        <label>Статус: <output>ОТВОРЕНИ</output></label>
    </p>
    

    <h2><b>Завеси</b></h2>
    <div>
        <label for="zavesi">Вклучен: </label>
        <input type="checkbox" id="zavesi" name="zavesi">
    </div>
    <div>
        <label for="zbaterija">Батерија: </label>
        <progress type="zbaterija" id="zbaterija" name="zbaterija" value="47" min="0" max="100"></progress>

    </div>
    
    <div>
        <label for="Otvaranje">Колку отворени: </label>
            <select id="Otvaranje" name="Otvaranje">

                <option value="poluotvoreni">Полу отворени</option>
                <option value="otvoreni">Целосно отворени</option>
            </select>
    </div>

    <h2><b>CO2</b></h2>

    </div>
    <div>
        <label for="vrednost">Вредност: </label>
        <progress id="vrednost" value="45" min="0" max="10000"></progress>

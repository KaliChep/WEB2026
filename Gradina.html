    <h2><b>Движење</b></h2>
    <div>
        <label for="dvizenje">Вклучен сензор: </label>
        <input type="checkbox" id="dvizenje" name="dvizenje">
    </div>
    <div>
        <label for="dbaterija">Батерија: </label>
        <progress type="dbaterija" id="dbaterija" name="dbaterija" value="12" min="0" max="100"></progress>
        <span>12%</span>
    </div>
    <p>
        <label>Статус: <output>Детектиранo ДВИЖЕЊЕ!</output></label>
    </p>
    

    <h2><b>UV</b></h2>
    <div>
        <label for="uv">Вклучен сензор: </label>
        <input type="checkbox" id="uv" name="uv">
    </div>
    <div>
        <label for="ubaterija">Батерија: </label>
        <progress type="ubaterija" id="ubaterija" name="ubaterija" value="99" min="0" max="100"></progress>
        <span>99%</span>
    </div>
    <p>
        <label>UV index: <output>5</output></label>
    </p>

    <h2><b>Ветер</b></h2>
    <div>
        <label for="veter">Вклучен сензор: </label>
        <input type="checkbox" id="veter" name="veter">
    </div>
    <div>
        <label for="vbaterija">Батерија: </label>
        <progress type="vbaterija" id="vbaterija" name="vbaterija" value="53" min="0" max="100"></progress>
        <span>53%</span>
    </div>
    <div>
        <label for="brzina">Брзина на ветер: </label>
        <progress id="brzina" value="12" min="0" max="1000"></progress>
        <span>Мирно: 12km/h</span>
    </div>

     <hr style="color: rgb(15, 104, 207);">

     <p>Нотификации: </p>

            <li>Детектиранo ДВИЖЕЊЕ!</li>
